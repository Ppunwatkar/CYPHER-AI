# ==============================================================================
# CIPHER AI - Alembic Database Migrations Configuration
# ==============================================================================

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os

# Output encoding
output_encoding = utf-8

# sqlalchemy.url is dynamically assigned in migrations/env.py from app.config.get_settings()
sqlalchemy.url = postgresql+psycopg://postgres:postgres@localhost:5432/cipher_db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
